name: Binary

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / Tag / Commit"
        required: false
        default: "main"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            goarch: amd64
            binary: llmproxy
          - platform: linux/arm64
            goarch: arm64
            binary: llmproxy-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Go binary (${{ matrix.binary }})
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w" \
            -o dist/${{ matrix.binary }} ./cmd/llmproxy/...

      - name: Verify binary architecture
        run: file dist/${{ matrix.binary }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v4

      - name: Prepare release assets
        run: |
          mkdir -p assets staging/amd64/config staging/arm64/config
          cp llmproxy/llmproxy staging/amd64/
          cp llmproxy-arm64/llmproxy-arm64 staging/arm64/
          cp start.sh staging/amd64/start.sh
          cp start.sh staging/arm64/start.sh
          cp config/config.json staging/amd64/config/config.json
          cp config/config.json staging/arm64/config/config.json
          chmod +x staging/amd64/llmproxy staging/arm64/llmproxy-arm64 staging/amd64/start.sh staging/arm64/start.sh
          tar czf assets/llmproxy-linux-amd64.tar.gz -C staging/amd64 .
          tar czf assets/llmproxy-linux-arm64.tar.gz -C staging/arm64 .

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/llmproxy-linux-amd64.tar.gz
            assets/llmproxy-linux-arm64.tar.gz